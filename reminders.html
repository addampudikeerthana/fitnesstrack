<!DOCTYPE html>
<html>
<head>
    <title>Reminders - FitnessTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav>
        <h2>Reminders</h2>
        <button onclick="goDashboard()" class="small-btn">Dashboard</button>
    </nav>
</header>

<section class="container">

    <h1>Daily Reminders</h1>

    <div class="reminder-grid">

        <div class="card">
            <h3>💧 Drink Water</h3>
            <input type="time" id="waterTime">
            <button onclick="saveReminder('waterTime','Drink Water')" class="btn">
                Save
            </button>
        </div>

        <div class="card">
            <h3>🍽️ Meal Time</h3>
            <input type="time" id="mealTime">
            <button onclick="saveReminder('mealTime','Meal Time')" class="btn">
                Save
            </button>
        </div>

        <div class="card">
            <h3>🏋️ Workout</h3>
            <input type="time" id="workoutTime">
            <button onclick="saveReminder('workoutTime','Workout')" class="btn">
                Save
            </button>
        </div>

        <div class="card">
            <h3>🚶 Walking</h3>
            <input type="time" id="walkingTime">
            <button onclick="saveReminder('walkingTime','Walking')" class="btn">
                Save
            </button>
        </div>

        <div class="card">
            <h3>😴 Sleep</h3>
            <input type="time" id="sleepTime">
            <button onclick="saveReminder('sleepTime','Sleep')" class="btn">
                Save
            </button>
        </div>

    </div>

    <div class="card reminder-list">
        <h2>Saved Reminders</h2>
        <div id="savedReminders"></div>
    </div>

</section>

<script src="script.js"></script>
</body>
</html>
